; PlatformIO Project Configuration File
; Sensor Node (ESP32 + DHT11)
;
; Use different environments so you never have to edit main.cpp:
;   pio run -e indoor1 -t upload
;   pio run -e outdoor1 -t upload
;   etc.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -I../shared

[env:indoor1]
build_flags =
    ${env.build_flags}
    -DNODE_ID=\"in1\"
    -DLOCATION=\"indoor\"

[env:indoor2]
build_flags =
    ${env.build_flags}
    -DNODE_ID=\"in2\"
    -DLOCATION=\"indoor\"

[env:outdoor1]
build_flags =
    ${env.build_flags}
    -DNODE_ID=\"out1\"
    -DLOCATION=\"outdoor\"

[env:outdoor2]
build_flags =
    ${env.build_flags}
    -DNODE_ID=\"out2\"
    -DLOCATION=\"outdoor\"
